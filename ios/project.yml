# Coach Kira – iPhone-App mit Widgets. Erzeugen: `xcodegen` im Ordner ios/, dann CoachKira.xcodeproj öffnen.
name: CoachKira
options:
  bundleIdPrefix: de.reichpietsch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # in Xcode unter Signing & Capabilities deine Apple-ID wählen
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CoachKira:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Coach Kira
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: de.reichpietsch.coachkira
            CFBundleURLSchemes: [coachkira]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/CoachKira.entitlements
      properties:
        com.apple.security.application-groups: [group.de.reichpietsch.coachkira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reichpietsch.coachkira
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CoachKiraWidgets
  CoachKiraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Coach Kira
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/CoachKiraWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.de.reichpietsch.coachkira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reichpietsch.coachkira.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
